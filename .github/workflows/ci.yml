name: Check portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check-export.py
      - run: docker compose config --quiet
      - run: docker compose -f compose.dev.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.aws.yaml config --quiet
        env:
          DOMAIN: example.com
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: sh scripts/smoke-container.sh
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
